<div id=settings class=settings>
  <div class=right>
    <div class=row>
      <label>
        <i class="icon map"></i>
        <span data-trans>Map</span>
      </label>
      <select id=sltMap></select>
    </div>
    <div class=row>
      <label>
        <i class="icon record"></i>
        <span data-trans>Recording</span>
      </label>
      <input type=checkbox id=chkAutoRecording>
    </div>
    <div class=row>
      <label>
        <i class="icon trophy"></i>
        <span data-trans>The winner is</span>
      </label>
      <div class=btn-group>
        <button class="active btn-first-winner btn-winner" data-trans>First</button>
        <button class="btn-last-winner btn-winner" data-trans>Last</button>
        <input type=number id=in_winningRank value=1 min=1>
      </div>
    </div>
    <div class=row>
      <label>
        <i class="bomb icon"></i>
        <span data-trans>Using skills</span>
      </label>
      <input type=checkbox id=chkSkill checked>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>짱구*5, 짱아*10, 봉미선*3</textarea>
    <div class=actions>
      <button id=btnSkins title="Marble skins">
        <i class="icon palette"></i>
      </button>
      <button id=btnEditor title="Map editor">
        <i class="icon map"></i>
      </button>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id=inGame class="hide settings">
  <button id=btnShake data-trans>Shake!</button>
</div>
<div id=editorOverlay><div id=editorRoot></div></div>
<div id=skins>
  <h1 data-trans>Marble skins</h1>
  <p class=skin-hint data-trans>Pick an image for each name. Images stay in this browser and are never uploaded.</p>
  <ul id=skinList></ul>
  <div class=skin-action>
    <button id=closeSkins data-trans>Close</button>
  </div>
</div>
<input type=file id=skinFileInput accept=image/* style=display:none>
